name: Piloto automático

on:
  schedule:
    - cron: "0 11 * * *"  # todo dia, 8h de Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: "Fazer outra rodada mesmo que a de hoje já exista"
        type: boolean
        default: true
      pedidos:
        description: "Pedidos nesta rodada"
        type: number
        default: 50

permissions:
  contents: write
  issues: write

concurrency:
  group: piloto
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodada do dia
        id: rodada
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_LITE: ${{ vars.GEMINI_MODEL_LITE }}
        run: python rodar_piloto.py --n ${{ inputs.pedidos || vars.PILOTO_PEDIDOS || 50 }} --pausa 12 --orcamento ${{ vars.PILOTO_ORCAMENTO || 0.50 }} ${{ inputs.forcar && '--forcar' || '' }}

      - name: Salva o resultado no repositório
        run: |
          git config user.name "piloto-automatico"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/execucoes
          git diff --cached --quiet && exit 0
          git commit -m "chore(piloto): rodada de $(date -u +%F)"
          git pull --rebase
          git push

      - name: Abre uma issue se a qualidade caiu
        if: steps.rodada.outputs.alerta != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTA: ${{ steps.rodada.outputs.alerta }}
        run: |
          gh issue create --title "Piloto: $ALERTA" --body "Alerta automático da rodada de $(date -u +%F). O roteador foi retreinado com a meta de qualidade; acompanhe a próxima rodada no app."
