name: Diagnóstico dos modelos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testa cada modelo da chave
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python diagnosticar_modelos.py
